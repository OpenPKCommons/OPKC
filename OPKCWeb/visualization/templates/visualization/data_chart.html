<!DOCTYPE html>
<html>
<head>
    <!-- All your <head> content (Tailwind, Plotly, styles) is identical -->
    <title>{{ chart_title }}</title>
    <script src="https://cdn.plot.ly/plotly-2.31.1.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', '"Noto Sans"', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        .modebar { background: transparent !important; }
        .modebar-group { background-color: white !important; border-radius: 6px !important; border: 1px solid #e2e8f0 !important; }
        .modebar-btn.active, .modebar-btn:hover { background-color: #f1f5f9 !important; }
        .modebar-btn.toggle { background-color: #f8fafc !important; }
        .modebar-btn.toggle:hover, .modebar-btn.toggle.active { background-color: #e2e8f0 !important; }
        .plotly-tooltip { background-color: white !important; border: 1px solid #e2e8f0 !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); color: #1e293b !important; }
        
        /* FIX: Force Plotly icons to be a visible color */
        .modebar-btn svg path {
            fill: #334155 !important; /* A dark slate gray */
        }

        /* Custom scrollbar for filter lists */
        .filter-list::-webkit-scrollbar { width: 5px; }
        .filter-list::-webkit-scrollbar-track { background: #f1f5f9; }
        .filter-list::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 5px; }
        .filter-list::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex flex-col lg:flex-row h-screen overflow-hidden">

    <!-- 1. Sidebar: Filters and Controls -->
    <aside class="w-full lg:w-1/4 h-1/2 lg:h-full bg-white shadow-lg border-r border-gray-200 flex flex-col">
        <!-- Header -->
        <div class="p-6 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-blue-700">Sample Explorer</h1>
            <p class="text-sm text-gray-600 mt-1">Filter by Study and Sample Type</p>
        </div>
        
        <!-- Filters Container -->
        <div class="flex-grow overflow-y-auto p-6 space-y-6">
            
            <!-- Filter: Studies -->
            <div id="study-filter-group">
                <div class="flex justify-between items-center mb-2">
                    <label class="font-semibold text-gray-700">Studies</label>
                    <div>
                        <button id="study-select-all" class="text-xs font-medium text-blue-600 hover:underline">All</button> |
                        <button id="study-select-none" class="text-xs font-medium text-blue-600 hover:underline">None</button>
                    </div>
                </div>
                <!-- Checkboxes will be dynamically inserted here -->
                <div id="study-filter-list" class="filter-list h-40 max-h-40 overflow-y-auto space-y-1 rounded-md border border-gray-300 p-3 bg-gray-50">
                    <!-- e.g., <label class="block"><input type="checkbox" value="StudyA"> StudyA</label> -->
                </div>
            </div>

            <!-- Filter: Sample Types -->
            <div id="sample-filter-group">
                <div class="flex justify-between items-center mb-2">
                    <label class="font-semibold text-gray-700">Sample Types</label>
                    <div>
                        <button id="sample-select-all" class="text-xs font-medium text-blue-600 hover:underline">All</button> |
                        <button id="sample-select-none" class="text-xs font-medium text-blue-600 hover:underline">None</button>
                    </div>
                </div>
                <!-- Checkboxes will be dynamically inserted here -->
                <div id="sample-filter-list" class="filter-list h-32 max-h-32 overflow-y-auto space-y-1 rounded-md border border-gray-300 p-3 bg-gray-50">
                    <!-- e.g., <label class="block"><input type="checkbox" value="Nasal"> Nasal</label> -->
                </div>
            </div>

            <!-- Status Message -->
            <div id="status-message" class="text-sm text-gray-600 italic text-center">
                Loading...
            </div>

        </div>
        
        <!-- Footer / Back Link -->
        <div class="p-4 border-t border-gray-200 bg-gray-50">
             <a href="{% url 'visualization:index' %}" 
               class="inline-flex items-center text-blue-600 hover:text-blue-800 hover:underline font-medium transition duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
                Back to Home
            </a>
        </div>
    </aside>

    <!-- 2. Main Content: Visualizations -->
    <main class="w-full lg:w-3/4 h-1/2 lg:h-full p-4 lg:p-8 flex flex-col space-y-6 overflow-y-auto">
        
        <!-- Plot 1: Viral Load vs. Time (Scatter) -->
        <div class="bg-white rounded-lg shadow-md border border-gray-200 p-4 md:p-6 flex-shrink-0">
            <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-6">
                Viral Load vs. Time
            </h2>
            <div id="vlScatterPlot" class="w-full h-[500px]">
                <!-- Scatter plot will be injected here -->
            </div>
        </div>
        
        <!-- Plot 2: Sample Count vs. Time (Bar) -->
        <div class="bg-white rounded-lg shadow-md border border-gray-200 p-4 md:p-6 flex-shrink-0">
            <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-6">
                Sample Count by Day
            </h2>
            <div id="timeDaysBarChart" class="w-full h-[500px]">
                <!-- Bar chart will be injected here -->
            </div>
        </div>

    </main>

    <!-- 3. JavaScript -->
    <script>
        // --- 1. Get Data from Django ---
        let ALL_DATA = [];
        let UNIQUE_STUDIES = [];
        let UNIQUE_SAMPLES = [];
        const statusMessage = document.getElementById('status-message');

        try {
            // Use JSON.parse on the data passed from the view
            ALL_DATA = JSON.parse('{{ all_data_json|safe }}');
            UNIQUE_STUDIES = JSON.parse('{{ study_ids_json|safe }}');
            UNIQUE_SAMPLES = JSON.parse('{{ sample_types_json|safe }}');
            
            if (!ALL_DATA || ALL_DATA.length === 0) {
                 statusMessage.textContent = 'No data loaded from server.';
            }
        } catch (e) {
            console.error("Error parsing JSON data:", e);
            statusMessage.textContent = 'Error loading data.';
            // Add error to filter lists
            document.getElementById('study-filter-list').innerHTML = '<p class="text-red-500">Error loading filters.</p>';
            document.getElementById('sample-filter-list').innerHTML = '<p class="text-red-500">Error loading filters.</p>';
        }
        
        // --- 2. Get DOM References ---
        const scatterPlotDiv = document.getElementById('vlScatterPlot');
        const barPlotDiv = document.getElementById('timeDaysBarChart');
        const studyListDiv = document.getElementById('study-filter-list');
        const sampleListDiv = document.getElementById('sample-filter-list');
        
        // Plotly's default color list (helps keep colors consistent)
        const PLOTLY_COLORS = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'];

        /**
         * Populates the filter checkboxes in the sidebar
         */
        function populateFilters() {
            // Populate Studies
            UNIQUE_STUDIES.forEach(study => {
                const label = document.createElement('label');
                label.className = 'block font-normal text-sm cursor-pointer hover:bg-gray-200 rounded px-1';
                label.innerHTML = `<input type="checkbox" class="filter-checkbox" data-filter-type="study" value="${study}" checked> ${study}`;
                studyListDiv.appendChild(label);
            });

            // Populate Sample Types
            UNIQUE_SAMPLES.forEach(sample => {
                const label = document.createElement('label');
                label.className = 'block font-normal text-sm cursor-pointer hover:bg-gray-200 rounded px-1';
                label.innerHTML = `<input type="checkbox" class="filter-checkbox" data-filter-type="sample" value="${sample}" checked> ${sample}`;
                sampleListDiv.appendChild(label);
            });

            if (UNIQUE_STUDIES.length === 0 && ALL_DATA.length > 0) {
                studyListDiv.innerHTML = '<p class="text-sm text-gray-500 italic">No studies found in data.</p>';
            }
            if (UNIQUE_SAMPLES.length === 0 && ALL_DATA.length > 0) {
                sampleListDiv.innerHTML = '<p class="text-sm text-gray-500 italic">No sample types found in data.</p>';
            }
        }

        /**
         * Main function to filter data and update both Plotly charts
         */
        function updatePlots() {
            // 1. Get selected filters
            const selectedStudies = Array.from(studyListDiv.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value);
            const selectedSamples = Array.from(sampleListDiv.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value);

            // 2. Filter the raw data
            const filteredData = ALL_DATA.filter(row => 
                selectedStudies.includes(row.StudyID) && 
                selectedSamples.includes(row.SampleType)
            );

            // 3. --- Prep Data for Scatter Plot (Stratified) ---
            const scatterTraces = {};
            let colorIndex = 0;
            const sampleColorMap = {}; // To assign a consistent color to each sample type
            
            filteredData.forEach(row => {
                // Ensure row has valid data for this plot
                if (row.TimeDays === null || row.Log10VL === null) {
                    return;
                }
                
                const traceName = row.SampleType;
                
                // Get or assign a color for this SampleType
                if (!sampleColorMap[traceName]) {
                    sampleColorMap[traceName] = PLOTLY_COLORS[colorIndex % PLOTLY_COLORS.length];
                    colorIndex++;
                }

                if (!scatterTraces[traceName]) {
                    scatterTraces[traceName] = {
                        x: [],
                        y: [],
                        mode: 'markers',
                        type: 'scatter',
                        name: traceName,
                        marker: { 
                            size: 6, 
                            opacity: 0.7,
                            color: sampleColorMap[traceName] // Assign color
                        }
                    };
                }
                scatterTraces[traceName].x.push(row.TimeDays);
                scatterTraces[traceName].y.push(row.Log10VL);
            });
            const scatterPlotData = Object.values(scatterTraces);

            // 4. --- Prep Data for Bar Plot ---
            const barCounts = {};
            filteredData.forEach(row => {
                if (row.TimeDays !== null) {
                    // Use floor to group days if they are decimals
                    const day = Math.floor(row.TimeDays); 
                    barCounts[day] = (barCounts[day] || 0) + 1;
                }
            });
            // Convert to sorted arrays for Plotly
            const sortedDays = Object.keys(barCounts).map(Number).sort((a, b) => a - b);
            const barPlotData = [{
                x: sortedDays,
                y: sortedDays.map(day => barCounts[day]),
                type: 'bar',
                name: 'Sample Count',
                marker: { color: 'rgb(37, 99, 235)' }
            }];

            // 5. --- Define Layouts ---
            const scatterLayout = {
                xaxis: {
                    title: 'Time (Days)',
                    gridcolor: '#f3f4f6',
                    zeroline: true,
                    zerolinecolor: '#d1d5db',
                },
                yaxis: {
                    title: 'Viral Load (Log10)',
                    gridcolor: '#f3f4f6',
                    zeroline: true,
                    zerolinecolor: '#d1d5db',
                    autorange: 'reversed' // Invert Y-axis
                },
                hovermode: 'closest',
                // FIX: Increased top margin and set bottom margin
                margin: { l: 60, r: 30, t: 60, b: 80 }, 
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                showlegend: true,
                // FIX: Move legend to bottom horizontal
                legend: {
                    orientation: 'h', // 'h' for horizontal
                    y: -0.2, // Place it just below the x-axis
                    yanchor: 'top',
                    x: 0.5,
                    xanchor: 'center'
                }
            };
            
            const barLayout = {
                xaxis: {
                    title: 'Infection day (Day 0 often reflects symptom onset or peak viral load)',
                    automargin: true,
                    gridcolor: '#f3f4f6',
                    zeroline: false
                },
                yaxis: {
                    title: 'Sample Count',
                    zeroline: true,
                    rangemode: 'tozero',
                    gridcolor: '#f3f4f6'
                },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                // FIX: Increased top margin
                margin: { l: 60, r: 30, t: 60, b: 50 }, 
            };

            // 6. --- Redraw Plots ---
            if (scatterPlotData.length > 0) {
                // Use Plotly.react for efficient updates
                Plotly.react(scatterPlotDiv, scatterPlotData, scatterLayout, { displayModeBar: true, responsive: true });
            } else {
                // Show a message if no data
                Plotly.react(scatterPlotDiv, [], {title: 'No data to display for selected filters'}, { responsive: true });
            }
            
            if (barPlotData[0].x.length > 0) {
                Plotly.react(barPlotDiv, barPlotData, barLayout, { displayModeBar: true, responsive: true });
            } else {
                Plotly.react(barPlotDiv, [], {title: 'No data to display for selected filters'}, { responsive: true });
            }

            // 7. Update status message
            statusMessage.textContent = `${filteredData.length} data points shown.`;
        }
        
        /**
         * Helper function for "Select All" / "Select None" buttons
         */
        function setCheckboxes(containerId, isChecked) {
            document.querySelectorAll(`#${containerId} input[type=checkbox]`).forEach(cb => {
                cb.checked = isChecked;
            });
            updatePlots(); // Re-draw the plot after changing
        }

        // --- 3. Attach Event Listeners ---
        
        // Add listeners to filter lists (using event delegation for efficiency)
        studyListDiv.addEventListener('change', updatePlots);
        sampleListDiv.addEventListener('change', updatePlots);

        // "Select All/None" buttons
        document.getElementById('study-select-all').addEventListener('click', () => setCheckboxes('study-filter-list', true));
        document.getElementById('study-select-none').addEventListener('click', () => setCheckS('study-filter-list', false));
        document.getElementById('sample-select-all').addEventListener('click', () => setCheckboxes('sample-filter-list', true));
        document.getElementById('sample-select-none').addEventListener('click', () => setCheckboxes('sample-filter-list', false));

        // --- 4. Initial Page Load ---
        document.addEventListener('DOMContentLoaded', () => {
            if (ALL_DATA.length > 0) {
                populateFilters();
                updatePlots();
            } else {
                 scatterPlotDiv.innerHTML = '<div class="w-full h-full flex items-center justify-center text-gray-500 italic">No data to display.</div>';
                 barPlotDiv.innerHTML = '<div class="w-full h-full flex items-center justify-center text-gray-500 italic">No data to display.</div>';
            }
        });

    </script>

</body>
</html>
