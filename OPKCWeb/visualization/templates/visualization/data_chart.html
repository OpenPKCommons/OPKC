<!DOCTYPE html>
<html>
<head>
    <title>{{ chart_title }}</title>
    <!-- 1. Load Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.31.1.min.js"></script>
    <!-- 2. Load Tailwind CSS (Re-added) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 3. Configure Tailwind (Re-added)
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', '"Noto Sans"', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <!-- 4. Add Plotly Toolbar Fix (Re-added) -->
    <style>
        .modebar {
            background: transparent !important;
        }
        .modebar-group {
            background-color: white !important;
            border-radius: 6px !important;
            border: 1px solid #e2e8f0 !important;
        }
        .modebar-btn.active, .modebar-btn:hover {
            background-color: #f1f5f9 !important;
        }
        .modebar-btn.toggle {
            background-color: #f8fafc !important;
        }
        .modebar-btn.toggle:hover, .modebar-btn.toggle.active {
            background-color: #e2e8f0 !important;
        }
        .plotly-tooltip {
            background-color: white !important;
            border: 1px solid #e2e8f0 !important;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            color: #1e293b !important;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Container with spacing for the two cards -->
    <div class="container mx-auto p-4 md:p-8 max-w-6xl space-y-8">
        
        <!-- Styled "Back to Home" Link -->
        <p>
            <!-- 3. FIXED: Use the correct app_name 'visualization' and 'index' URL name -->
            <a href="{% url 'visualization:index' %}" 
               class="inline-flex items-center text-blue-600 hover:text-blue-800 hover:underline font-medium transition duration-150">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
                Back to Home
            </a>
        </p>

        <!-- Card 1: Bar Chart -->
        <div class="bg-white rounded-lg shadow-md border border-gray-200 p-4 md:p-6">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-6">
                {{ chart_title }}
            </h1>
            <div id="timeDaysBarChart" class="w-full h-[500px]"></div>
        </div>
        
        <!-- Card 2: Scatter Plot (Re-added) -->
        <div class="bg-white rounded-lg shadow-md border border-gray-200 p-4 md:p-6">
            <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-6">
                Viral Load vs. Time
            </h2>
            <div id="vlScatterPlot" class="w-full h-[500px]"></div>
        </div>

    </div>

    <script>
        // === PLOT 1: BAR CHART ===
        try {
            // --- 4. FIXED: Read the JSON data directly ---
            // We removed JSON.parse() and the single quotes
            const labels = {{ chart_labels|safe }};
            const data = {{ chart_data|safe }};
            
            const chartData = [{
                x: labels,
                y: data,
                type: 'bar',
                name: 'Sample Count',
                marker: { color: 'rgb(37, 99, 235)' }
            }];

            const layout = {
                xaxis: {
                    title: 'Infection day (Day 0 often reflects symptom onset or peak viral load)',
                    automargin: true,
                    gridcolor: '#f3f4f6',
                    zeroline: false
                },
                yaxis: {
                    title: 'Sample Count',
                    zeroline: true,
                    rangemode: 'tozero',
                    gridcolor: '#f3f4f6'
                },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                margin: { l: 60, r: 30, t: 20, b: 50 },
                responsive: true
            };

            Plotly.newPlot('timeDaysBarChart', chartData, layout, {
                displayModeBar: true
            });
        } catch (e) {
            console.error("Could not load bar chart data:", e);
            document.getElementById('timeDaysBarChart').innerHTML = '<p class="text-red-500 text-center italic p-4">Error loading bar chart data.</p>';
        }


        // === PLOT 2: SCATTER PLOT (Re-added) ===
        try {
            // Read the new JSON data for the scatter plot
            const scatterData = {{ scatter_data_json|safe }};
            
            if (!scatterData || !scatterData.x || scatterData.x.length === 0) {
                 throw new Error("No scatter data loaded from CSV.");
            }

            const scatterPlotData = [{
                x: scatterData.x,
                y: scatterData.y,
                mode: 'markers',
                type: 'scatter',
                name: 'Viral Load',
                marker: {
                    color: 'rgb(220, 38, 38)', // A red color
                    opacity: 0.5,
                    size: 6
                }
            }];

            const scatterLayout = {
                xaxis: {
                    title: 'Time (Days)',
                    gridcolor: '#f3f4f6',
                    zeroline: true,
                    zerolinecolor: '#d1d5db'
                },
                yaxis: {
                    title: 'Viral Load (Log10)',
                    gridcolor: '#f3f4f6',
                    zeroline: true,
                    zerolinecolor: '#d1d5db',
                    autorange: 'reversed'
                },
                hovermode: 'closest',
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                margin: { l: 60, r: 30, t: 30, b: 50 },
                responsive: true
            };

            Plotly.newPlot('vlScatterPlot', scatterPlotData, scatterLayout, {
                displayModeBar: true
            });

        } catch (e) {
            console.error("Could not load scatter plot data:", e);
            document.getElementById('vlScatterPlot').innerHTML = '<p class="text-red-500 text-center italic p-4">Error loading scatter plot data. Check server logs.</p>';
        }

    </script>

</body>
</html>
