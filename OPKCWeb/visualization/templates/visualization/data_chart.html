<!DOCTYPE html>
<html>
<head>
    <!-- All your <head> content (Tailwind, Plotly, styles) is identical -->
    <title>{{ chart_title }}</title>
    <script src="https://cdn.plot.ly/plotly-2.31.1.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', '"Noto Sans"', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        .modebar { background: transparent !important; }
        .modebar-group { background-color: white !important; border-radius: 6px !important; border: 1px solid #e2e8f0 !important; }
        .modebar-btn.active, .modebar-btn:hover { background-color: #f1f5f9 !important; }
        .modebar-btn.toggle { background-color: #f8fafc !important; }
        .modebar-btn.toggle:hover, .modebar-btn.toggle.active { background-color: #e2e8f0 !important; }
        .plotly-tooltip { background-color: white !important; border: 1px solid #e2e8f0 !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); color: #1e293b !important; }
        
        /* Custom styles for the filter list */
        .filter-list-container {
            max-height: 200px; /* Give a max height for scrolling */
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            padding: 8px;
            border-radius: 6px;
            background-color: #f8fafc;
        }
        /* Custom checkbox */
        .filter-list-container label {
            display: block;
            position: relative;
            padding-left: 28px;
            margin-bottom: 5px;
            cursor: pointer;
            font-size: 14px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .filter-list-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }
        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 18px;
            width: 18px;
            background-color: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }
        .filter-list-container label:hover input ~ .checkmark {
            background-color: #e2e8f0;
        }
        .filter-list-container input:checked ~ .checkmark {
            background-color: #2563eb; /* Blue */
            border-color: #2563eb;
        }
        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }
        .filter-list-container input:checked ~ .checkmark:after {
            display: block;
        }
        .filter-list-container .checkmark:after {
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 3px 3px 0;
            -webkit-transform: rotate(45deg);
            -ms-transform: rotate(45deg);
            transform: rotate(45deg);
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- 1. Page Container (Sidebar + Content) -->
    <div class="flex flex-col lg:flex-row min-h-screen">
        
        <!-- 2. Sidebar -->
        <aside class="w-full lg:w-64 xl:w-72 bg-white border-r border-gray-200 p-6 flex flex-col space-y-6">
            <h1 class="text-xl font-bold text-gray-900">{{ chart_title }}</h1>
            
            <p class="text-sm text-gray-600 -mt-2">
                Use the filters below to update the plots.
            </p>

            <!-- Back to Home Link -->
            <p>
                <a href="{% url 'visualization:index' %}" 
                   class="inline-flex items-center text-sm text-blue-600 hover:text-blue-800 hover:underline font-medium transition duration-150">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                    Back to Home
                </a>
            </p>

            <!-- Filter Section: Studies -->
            <div>
                <h2 class="text-base font-semibold text-gray-700 mb-2">Filter by Study</h2>
                <div class="flex space-x-2 mb-2">
                    <button id="study-select-all" class="text-xs font-medium text-blue-600 hover:underline">Select All</button>
                    <span class="text-gray-300">|</span>
                    <button id="study-select-none" class="text-xs font-medium text-blue-600 hover:underline">Select None</button>
                </div>
                <div id="study-filter-list" class="filter-list-container">
                    <!-- Checkboxes for studies will be inserted here by JS -->
                </div>
            </div>

            <!-- NEW: Filter Section: Sample Types -->
            <div>
                <h2 class="text-base font-semibold text-gray-700 mb-2">Filter by Sample Type</h2>
                <div class="flex space-x-2 mb-2">
                    <button id="sample-select-all" class="text-xs font-medium text-blue-600 hover:underline">Select All</button>
                    <span class="text-gray-300">|</span>
                    <button id="sample-select-none" class="text-xs font-medium text-blue-600 hover:underline">Select None</button>
                </div>
                <div id="sample-filter-list" class="filter-list-container">
                    <!-- Checkboxes for sample types will be inserted here by JS -->
                </div>
            </div>

            <div class="flex-grow"></div> <!-- Pushes status to bottom -->

            <div id="status-message" class="text-sm text-gray-500 italic text-center">
                Loading...
            </div>
        </aside>

        <!-- 3. Main Content Area (Plots) -->
        <main class="flex-1 p-4 md:p-8 space-y-8">
            
            <!-- Plot Card 1: Viral Load vs. Time (SCATTER) -->
            <div class="bg-white rounded-lg shadow-md border border-gray-200 p-4 md:p-6">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">
                    Viral Load vs. Time
                </h2>
                <div id="vlScatterPlot" class="w-full h-[500px]">
                    <!-- Scatter plot will be injected here -->
                </div>
            </div>

            <!-- Plot Card 2: Sample Count (BAR) -->
            <div class="bg-white rounded-lg shadow-md border border-gray-200 p-4 md:p-6">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">
                    Sample Count by Day
                </h2>
                <div id="timeDaysBarChart" class="w-full h-[500px]">
                    <!-- Bar chart will be injected here -->
                </div>
            </div>

        </main>
    </div>

    <!-- 4. JavaScript Logic -->
    <script>
        // --- 1. Get Data from Django ---
        let ALL_DATA = [];
        let STUDY_IDS = [];
        let SAMPLE_TYPES = [];
        
        try {
            // Parse all the JSON data passed from the view
            ALL_DATA = JSON.parse('{{ all_data_json|safe }}');
            STUDY_IDS = JSON.parse('{{ study_ids_json|safe }}');
            SAMPLE_TYPES = JSON.parse('{{ sample_types_json|safe }}');
            
            if (!ALL_DATA || ALL_DATA.length === 0) {
                 throw new Error("No data loaded.");
            }
            
        } catch (e) {
            console.error("Error parsing Django data:", e);
            document.getElementById('status-message').textContent = 'Error loading data.';
            // Hide filters if data load fails
            document.getElementById('study-filter-list').parentElement.style.display = 'none';
            document.getElementById('sample-filter-list').parentElement.style.display = 'none';
        }

        // --- 2. Get DOM Element References ---
        const studyFilterContainer = document.getElementById('study-filter-list');
        const sampleFilterContainer = document.getElementById('sample-filter-list');
        const statusMessage = document.getElementById('status-message');

        /**
         * 3. Main function to update both plots based on filters
         */
        function updatePlots() {
            // Get all selected Study IDs
            const selectedStudies = Array.from(studyFilterContainer.querySelectorAll('input:checked'))
                                         .map(cb => cb.dataset.value);
            
            // Get all selected Sample Types
            const selectedSamples = Array.from(sampleFilterContainer.querySelectorAll('input:checked'))
                                         .map(cb => cb.dataset.value);

            // Filter the master data list
            const filteredData = ALL_DATA.filter(d => 
                selectedStudies.includes(d.StudyID) &&
                selectedSamples.includes(d.SampleType)
            );
            
            // Update status message
            statusMessage.textContent = `Showing ${filteredData.length} data points.`;
            
            // --- A. Update Scatter Plot (Stratified) ---
            updateScatterPlot(filteredData);
            
            // --- B. Update Bar Plot (Aggregated) ---
            updateBarPlot(filteredData);
        }
        
        /**
         * 3A. Updates the Scatter Plot
         * This function now groups data by SampleType to create separate, colored traces.
         */
        function updateScatterPlot(data) {
            // Group data by SampleType
            const groups = {};
            data.forEach(row => {
                if (row.Log10VL === null || row.TimeDays === null) return; // Skip nulls
                
                const sampleType = row.SampleType || 'Unknown';
                if (!groups[sampleType]) {
                    groups[sampleType] = {
                        x: [],
                        y: [],
                        mode: 'markers',
                        type: 'scatter',
                        name: sampleType, // This name appears in the legend
                        marker: { size: 6, opacity: 0.7 }
                    };
                }
                groups[sampleType].x.push(row.TimeDays);
                groups[sampleType].y.push(row.Log10VL);
            });

            const scatterPlotData = Object.values(groups); // Convert groups object to an array of traces
            
            const scatterLayout = {
                xaxis: { title: 'Time (Days)', gridcolor: '#f3f4f6', zerolinecolor: '#d1d5db' },
                yaxis: { title: 'Viral Load (Log10)', gridcolor: '#f3f4f6', zerolinecolor: '#d1d5db', autorange: 'reversed' },
                hovermode: 'closest',
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                margin: { l: 60, r: 30, t: 30, b: 50 },
                responsive: true,
                showlegend: true // Show the legend for sample types
            };
            
            Plotly.newPlot('vlScatterPlot', scatterPlotData, scatterLayout, { displayModeBar: true });
        }
        
        /**
         * 3B. Updates the Bar Plot
         */
        function updateBarPlot(data) {
            // Aggregate the filtered data for the bar chart
            const counts = {};
            data.forEach(row => {
                if (row.TimeDays === null) return; // Skip nulls
                counts[row.TimeDays] = (counts[row.TimeDays] || 0) + 1;
            });
            
            // Sort by day (keys) to ensure correct order
            const sortedDays = Object.keys(counts).map(Number).sort((a, b) => a - b);
            const labels = sortedDays;
            const values = sortedDays.map(day => counts[day]);

            const barPlotData = [{
                x: labels,
                y: values,
                type: 'bar',
                name: 'Sample Count',
                marker: { color: 'rgb(37, 99, 235)' }
            }];
            
            const barLayout = {
                xaxis: { title: 'Infection day', automargin: true, gridcolor: '#f3f4f6', zeroline: false },
                yaxis: { title: 'Sample Count', zeroline: true, rangemode: 'tozero', gridcolor: '#f3f4f6' },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                margin: { l: 60, r: 30, t: 20, b: 50 },
                responsive: true
            };
            
            Plotly.newPlot('timeDaysBarChart', barPlotData, barLayout, { displayModeBar: true });
        }

        /**
         * 4. Helper function to create checkboxes in the sidebar
         */
        function createFilterCheckboxes(container, items) {
            items.forEach(item => {
                const label = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'checkbox';
                input.checked = true;
                input.dataset.value = item; // Store the value for filtering
                input.addEventListener('change', updatePlots); // Hook up the update function
                
                const checkmark = document.createElement('span');
                checkmark.className = 'checkmark';
                
                label.appendChild(input);
                label.appendChild(checkmark);
                label.appendChild(document.createTextNode(` ${item}`));
                
                container.appendChild(label);
            });
        }
        
        /**
         * 5. Set up "Select All" / "Deselect All" buttons
         */
        function setupFilterButtons() {
            // Study Buttons
            document.getElementById('study-select-all').addEventListener('click', () => {
                studyFilterContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
                updatePlots();
            });
            document.getElementById('study-select-none').addEventListener('click', () => {
                studyFilterContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                updatePlots();
            });
            
            // Sample Type Buttons
            document.getElementById('sample-select-all').addEventListener('click', () => {
                sampleFilterContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
                updatePlots();
            });
            document.getElementById('sample-select-none').addEventListener('click', () => {
                sampleFilterContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                updatePlots();
            });
        }

        // --- 6. Initialize the Dashboard ---
        if (ALL_DATA.length > 0) {
            createFilterCheckboxes(studyFilterContainer, STUDY_IDS);
            createFilterCheckboxes(sampleFilterContainer, SAMPLE_TYPES);
            setupFilterButtons();
            updatePlots(); // Call once on page load to draw the initial plots
        } else {
            // Show error messages in plots if no data
            document.getElementById('vlScatterPlot').innerHTML = '<p class="text-center text-gray-500 p-8">No data to display.</p>';
            document.getElementById('timeDaysBarChart').innerHTML = '<p class="text-center text-gray-500 p-8">No data to display.</p>';
        }

    </script>

</body>
</html>
